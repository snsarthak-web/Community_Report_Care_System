{% set up = url_for('static', filename='uploads/') %}
{% if c.image_path and c.resolution_image %}
  <div class="ba"><figure><img id="mainphoto" src="{{ up }}{{ c.image_path }}" alt="Before repair"><figcaption>Before</figcaption></figure>
  <figure class="after"><img src="{{ up }}{{ c.resolution_image }}" alt="After repair"><figcaption>After repair</figcaption></figure></div>
{% elif c.image_path %}<div class="single"><img id="mainphoto" src="{{ up }}{{ c.image_path }}" alt="Complaint photo"></div>
{% elif c.resolution_image %}<div class="single"><img src="{{ up }}{{ c.resolution_image }}" alt="After repair"></div>
{% else %}<div class="slot nophoto"><span>No photo attached</span></div>{% endif %}
{% if c.image_path and det and det.annotated_path %}<div class="tog"><button type="button" class="btn btn-sm btn-outline-primary" onclick="document.getElementById('mainphoto').src='{{ up }}{{ c.image_path }}'">Original</button>
<button type="button" class="btn btn-sm btn-outline-danger" onclick="document.getElementById('mainphoto').src='{{ up }}{{ det.annotated_path }}'">AI detection boxes</button></div>{% endif %}
