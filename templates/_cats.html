{% set colors = ['#0a4fc4','#22b24c','#f59e0b','#8b3fd1','#64748b','#06b6d4','#ef4444','#14b8a6'] %}
{% for c in cats %}<div class="bar"><span>{{ c.name }}</span><div><i style="width:{{ c.pct }}%;background:{{ colors[loop.index0 % 8] }}"></i></div><em>{{ c.n }} · {{ c.pct }}%</em></div>
{% else %}<p class="empty">Nothing to show yet.</p>{% endfor %}
